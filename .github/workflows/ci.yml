name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-worker:
    name: Main Worker schema, smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Validate canonical D1 schema and migration replay
        run: npm run check:schema
      - name: Validate admin and business OAuth boundaries
        run: npm run check:auth
      - name: Smoke test homepage and listing routes
        run: npm run smoke:main
      - name: Build main Worker
        run: npm run build:main

  business-agent:
    name: Business Agent type contract, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/business-agent/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/business-agent
      - name: Type-check SDK contracts
        run: npm run test:sdk-contract
        working-directory: workers/business-agent
      - name: Run unit tests
        run: npm run test:unit
        working-directory: workers/business-agent
      - name: Build Business Agent
        run: npm run build
        working-directory: workers/business-agent

  analyzer-worker:
    name: Analyzer Worker type and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/analyzer-worker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/analyzer-worker
      - run: npx tsc --noEmit
        working-directory: workers/analyzer-worker
      - run: npx wrangler deploy --dry-run --outdir=dist-dry-run
        working-directory: workers/analyzer-worker

  facebook-worker:
    name: Facebook Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/facebook-worker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/facebook-worker
      - run: npx wrangler deploy --dry-run --outdir=dist-dry-run
        working-directory: workers/facebook-worker

  security-advisory:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit root dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Audit Business Agent dependencies
        run: npm audit --audit-level=moderate
        working-directory: workers/business-agent
        continue-on-error: true

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [main-worker, business-agent, analyzer-worker, facebook-worker]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          if [ "${{ needs.main-worker.result }}" != "success" ] || \
             [ "${{ needs.business-agent.result }}" != "success" ] || \
             [ "${{ needs.analyzer-worker.result }}" != "success" ] || \
             [ "${{ needs.facebook-worker.result }}" != "success" ]; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"